<html lang="es-ES">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>selai — Atiende cada lead en 15 segundos | IA para inmobiliarias en España</title>
<meta name="description" content="selai es el asistente de IA conversacional que atiende WhatsApp, email, web y teléfono de tu inmobiliaria 24/7. Respuesta en 15 segundos, entrenado con tus mejores ventas." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'selai-50':  '#F5F7FF',
          'selai-100': '#EAEEFF',
          'selai-200': '#D4DBFF',
          'selai-300': '#B0B8FF',
          'selai-400': '#7B83FF',
          'selai-500': '#5B61F0',
          'selai-600': '#4A4FD9',
          'selai-700': '#3A3EB0',
          'selai-900': '#1A1B33',
          'ink-900':   '#0B0D17',
          'ink-800':   '#13162A',
          'ink-700':   '#1F2333',
          'ink-500':   '#4A4F66',
          'ink-300':   '#9098B0',
          'paper':     '#FAFAFC',
          'accent':    '#FF7A59',
          'accent-2':  '#FF9F7A',
          'wa':        '#25D366',
          'wa-bg':     '#0B141A',
          'wa-bubble': '#005C4B',
        },
        fontFamily: {
          display: ['Fraunces', 'serif'],
          sans:    ['Inter', 'system-ui', 'sans-serif'],
          mono:    ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
        },
        boxShadow: {
          'soft':  '0 24px 60px -30px rgba(91,97,240,0.40)',
          'card':  '0 1px 0 rgba(11,13,23,0.04), 0 12px 40px -16px rgba(11,13,23,0.10)',
          'glow':  '0 0 0 1px rgba(91,97,240,0.20), 0 24px 60px -20px rgba(91,97,240,0.45)',
          'accent':'0 16px 40px -16px rgba(255,122,89,0.55)',
        },
        keyframes: {
          'rise': { '0%': { opacity: 0, transform: 'translateY(16px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },
          'breathe': { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-6px)' } },
          'pulse-line': { '0%,100%': { opacity: 0.35 }, '50%': { opacity: 1 } },
          'orbit': { '0%': { transform: 'rotate(0deg) translateX(180px) rotate(0deg)' }, '100%': { transform: 'rotate(360deg) translateX(180px) rotate(-360deg)' } },
          'shimmer': { '0%': { backgroundPosition: '-200% 0' }, '100%': { backgroundPosition: '200% 0' } },
          'typing': { '0%,80%,100%': { opacity: 0.2 }, '40%': { opacity: 1 } },
        },
        animation: {
          'rise': 'rise 0.7s cubic-bezier(0.16,1,0.3,1) both',
          'breathe': 'breathe 6s ease-in-out infinite',
          'pulse-line': 'pulse-line 2.4s ease-in-out infinite',
          'shimmer': 'shimmer 3s linear infinite',
        },
      }
    }
  }
</script>
<style>
  html, body { background: #FAFAFC; color: #0B0D17; }
  body { font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .font-display { font-family: 'Fraunces', serif; font-optical-sizing: auto; letter-spacing: -0.035em; }
  .font-mono { font-family: 'JetBrains Mono', monospace; }
  /* hero grid background */
  .grid-bg {
    background-image:
      linear-gradient(to right, rgba(11,13,23,0.045) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(11,13,23,0.045) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, black 30%, transparent 80%);
  }
  .noise {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.5'/></svg>");
  }
  /* word-by-word stagger */
  .stagger > span { display: inline-block; opacity: 0; transform: translateY(16px); animation: rise 0.7s cubic-bezier(0.16,1,0.3,1) forwards; }
  .stagger > span.space { width: 0.28em; }
  /* glass header */
  .glass { backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%); }
  /* dotted connector */
  .dotted { background-image: radial-gradient(circle, currentColor 1px, transparent 1.5px); background-size: 10px 10px; }
  /* typing dots */
  .dot { animation: typing 1.4s ease-in-out infinite; }
  .dot:nth-child(2){ animation-delay: 0.2s; }
  .dot:nth-child(3){ animation-delay: 0.4s; }
  /* draw path */
  .draw { stroke-dasharray: 1; stroke-dashoffset: 1; pathLength: 1; }
  .draw.in-view { animation: draw 1.6s cubic-bezier(0.16,1,0.3,1) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  /* ticker */
  @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .ticker { animation: ticker 40s linear infinite; }
  /* counter */
  .tabular { font-variant-numeric: tabular-nums; }
  /* floating card */
  .float-1 { animation: breathe 7s ease-in-out infinite; }
  .float-2 { animation: breathe 9s ease-in-out infinite 1s; }
  .float-3 { animation: breathe 8s ease-in-out infinite 0.5s; }
  .float-4 { animation: breathe 10s ease-in-out infinite 1.5s; }
  /* subtle grain on dark sections */
  .grain::before {
    content:''; position:absolute; inset:0; pointer-events:none; opacity:0.06;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    mix-blend-mode: overlay;
  }
  /* hide scrollbar in tabs */
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }
  /* selection */
  ::selection { background: #5B61F0; color: white; }
  /* focus rings */
  *:focus-visible { outline: 2px solid #5B61F0; outline-offset: 2px; border-radius: 6px; }
  /* prefers reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
</style>
