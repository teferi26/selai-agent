[project]
name = "realtor-ai-backend"
version = "0.1.0"
description = "AI agent backend for real estate agencies"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "redis>=5.2",
    "celery>=5.4",
    "anthropic>=0.39",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "structlog>=24.4",
    "tenacity>=9.0",
    "phonenumbers>=8.13",
    "python-dateutil>=2.9",
    "langdetect>=1.0.9",
    "weasyprint>=63.0",
    "jinja2>=3.1",
    "boto3>=1.35",
    "PyJWT[crypto]>=2.13.0",
    "cryptography>=43",
    "google-api-python-client>=2.150",
    "google-auth>=2.36",
    "google-auth-oauthlib>=1.2",
    "sentry-sdk[fastapi]>=2.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "respx>=0.21",
    "freezegun>=1.5",
    "pip-audit>=2.9",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ASYNC"]
# E501: line length is advisory. B008: Depends() in defaults is the FastAPI
# idiom. UP042: (str, Enum) -> StrEnum would change SQLAlchemy enum storage.
ignore = ["E501", "B008", "UP042"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
